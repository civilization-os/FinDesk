name: finforge

services:
  backend:
    image: ghcr.io/civilization-os/findesk-api:${FINFORGE_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      FINFORGE_SETTINGS_FILE: /app/data/settings.json
    volumes:
      - finforge-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - app

  frontend:
    image: ghcr.io/civilization-os/findesk-web:${FINFORGE_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FINFORGE_HOST:-0.0.0.0}:${FINFORGE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  finforge-data:
    name: finforge-data
