name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Smoke test API health endpoint
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          uvicorn app:app --host 127.0.0.1 --port 8000 > /tmp/finforge-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health > /tmp/finforge-health.json; then
              cat /tmp/finforge-health.json
              exit 0
            fi
            sleep 1
          done

          cat /tmp/finforge-api.log
          exit 1

  compose:
    name: Validate Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f compose.prod.yaml config --quiet

  containers:
    name: Container · ${{ matrix.name }}
    needs:
      - frontend
      - backend
      - compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            file: ./Dockerfile
          - name: api
            context: ./backend
            file: ./backend/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}
