name: finforge

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: finforge-api:local
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      FINFORGE_SETTINGS_FILE: /app/data/settings.json
      FINFORGE_USER_DATA_FILE: /app/data/user-data.json
    volumes:
      - finforge-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    networks:
      - app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: finforge-web:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FINFORGE_HOST:-0.0.0.0}:${FINFORGE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  finforge-data:
    name: finforge-data
